name: Enable GitHub Pages

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages
        run: |
          gh api --method POST /repos/${{ github.repository }}/pages \
            -f "source[branch]=master" -f "source[path]=/" || echo "enable failed"
          gh api /repos/${{ github.repository }}/pages || echo "get pages failed"
        env:
          GH_TOKEN: ${{ github.token }}
